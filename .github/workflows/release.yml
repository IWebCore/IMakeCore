name: Create Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v 开头的标签，例如 v1.0.0, v2.1.0-rc.1

permissions:
  contents: write  # 允许创建 releases

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录，用于生成 changelog
    
    - name: Set up environment
      id: vars
      run: |
        # 从标签名提取版本号（去除 v 前缀）
        VERSION="${GITHUB_REF#refs/tags/}"
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
        # 设置发布日期
        echo "release_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
        echo "Version: $VERSION"
        echo "Tag: ${GITHUB_REF#refs/tags/}"
    
    - name: Prepare release assets
      run: |
        # 创建临时目录存放发布文件
        mkdir -p release_assets
        
        # 复制主要安装脚本和文档
        cp windows_install.bat release_assets/
        cp linux_install.sh release_assets/
        cp README.md release_assets/
        cp .gitignore release_assets/
        
        # 创建完整的项目打包
        mkdir -p release_assets/IMakeCore
        
        # 复制所有项目文件到打包目录
        echo "Copying project files..."
        cp -r .programs release_assets/IMakeCore/
        cp -r .system release_assets/IMakeCore/
        cp windows_install.bat release_assets/IMakeCore/
        cp linux_install.sh release_assets/IMakeCore/
        cp README.md release_assets/IMakeCore/
        cp .gitignore release_assets/IMakeCore/
        
        # 创建版本信息文件
        cat > release_assets/IMakeCore/VERSION << EOF
        Version: ${{ steps.vars.outputs.version }}
        Release Date: ${{ steps.vars.outputs.release_date }}
        Git Tag: ${{ steps.vars.outputs.tag }}
        EOF
        
        # 创建打包文件（Windows 和 Linux 格式）
        cd release_assets
        echo "Creating ZIP archive for Windows..."
        zip -r "IMakeCore-${{ steps.vars.outputs.version }}.zip" IMakeCore/
        
        echo "Creating TAR.GZ archive for Linux..."
        tar -czf "IMakeCore-${{ steps.vars.outputs.version }}.tar.gz" IMakeCore/
        
        # 为每个平台创建独立的安装包
        echo "Creating Windows standalone package..."
        mkdir -p "IMakeCore-Windows-${{ steps.vars.outputs.version }}"
        cp windows_install.bat "IMakeCore-Windows-${{ steps.vars.outputs.version }}/"
        cp -r .programs "IMakeCore-Windows-${{ steps.vars.outputs.version }}/"
        cp -r .system "IMakeCore-Windows-${{ steps.vars.outputs.version }}/"
        cp README.md "IMakeCore-Windows-${{ steps.vars.outputs.version }}/"
        zip -r "IMakeCore-Windows-${{ steps.vars.outputs.version }}.zip" "IMakeCore-Windows-${{ steps.vars.outputs.version }}/"
        
        echo "Creating Linux standalone package..."
        mkdir -p "IMakeCore-Linux-${{ steps.vars.outputs.version }}"
        cp linux_install.sh "IMakeCore-Linux-${{ steps.vars.outputs.version }}/"
        cp -r .programs "IMakeCore-Linux-${{ steps.vars.outputs.version }}/"
        cp -r .system "IMakeCore-Linux-${{ steps.vars.outputs.version }}/"
        cp README.md "IMakeCore-Linux-${{ steps.vars.outputs.version }}/"
        tar -czf "IMakeCore-Linux-${{ steps.vars.outputs.version }}.tar.gz" "IMakeCore-Linux-${{ steps.vars.outputs.version }}/"
        
        # 列出生成的所有文件
        echo "Generated release assets:"
        ls -la
    
    - name: Generate changelog
      id: changelog
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') || contains(github.ref, '-alpha.') }}
        generate_release_notes: true
        files: |
          release_assets/windows_install.bat
          release_assets/linux_install.sh
          release_assets/README.md
          release_assets/IMakeCore-${{ steps.vars.outputs.version }}.zip
          release_assets/IMakeCore-${{ steps.vars.outputs.version }}.tar.gz
          release_assets/IMakeCore-Windows-${{ steps.vars.outputs.version }}.zip
          release_assets/IMakeCore-Linux-${{ steps.vars.outputs.version }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Output release info
      run: |
        echo "Release created successfully!"
        echo "Version: ${{ steps.vars.outputs.version }}"
        echo "Tag: ${{ steps.vars.outputs.tag }}"
        echo "Release Date: ${{ steps.vars.outputs.release_date }}"